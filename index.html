<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Verifikasi KENPA Guru - SMPN 4 Monano</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ecc71;
            --danger: #ef4444;
            --slate-800: #1e293b;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f0f2f5;
            background-image: radial-gradient(at 0% 0%, rgba(67, 97, 238, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(72, 149, 239, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: var(--slate-800);
        }

        .container {
            max-width: 1450px;
            margin: 0 auto;
            background: var(--glass);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
        }

        /* --- TEKS SUMBER DATA MENYALA --- */
        .source-tag {
            position: absolute;
            top: 20px;
            left: 30px;
            font-weight: 800;
            font-size: 11px;
            color: #fff;
            background: #1e293b;
            padding: 5px 12px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(67, 97, 238, 0.8), 0 0 20px rgba(67, 97, 238, 0.4);
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            from { box-shadow: 0 0 5px rgba(67, 97, 238, 0.6); }
            to { box-shadow: 0 0 15px rgba(67, 97, 238, 1), 0 0 25px rgba(67, 97, 238, 0.5); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        h2 { font-size: 26px; font-weight: 800; margin: 0; }
        .subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }

        /* --- RESPONSIVE TABLE --- */
        .table-container { overflow-x: auto; border-radius: 16px; border: 1px solid #e2e8f0; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1200px; }
        th { background: #f8fafc; padding: 15px; font-weight: 700; text-transform: uppercase; font-size: 10px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }

        .row-green td { background-color: #f0fdf4 !important; }
        .row-red td { background-color: #fef2f2 !important; }

        .name-cell { font-weight: 700; font-size: 13px; display: block; }
        .mk-label { font-size: 10px; color: var(--primary); font-weight: 600; background: rgba(67, 97, 238, 0.1); padding: 2px 6px; border-radius: 4px; }

        select, input {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 11px; outline: none; transition: 0.2s;
        }

        .input-koreksi { display: none; margin-top: 8px; }

        .btn-save {
            display: block; width: 100%; max-width: 350px; margin: 30px auto; padding: 16px;
            background: var(--primary); color: white; border: none; border-radius: 50px;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 15px rgba(67, 97, 238, 0.3);
        }

        /* --- FOOTER CREDIT --- */
        .footer-credit {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .footer-credit span { color: var(--primary); }

        /* Mobile Adjustments */
        @media screen and (max-width: 768px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            h2 { font-size: 20px; }
            .source-tag { font-size: 8px; left: 20px; top: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="source-tag">SUMBER DATA: DAPODIK 2026.B</div>

    <div class="header-section">
        <h2>E-Verifikasi KENPA & Masa Kerja</h2>
        <p class="subtitle">SMP Negeri 4 Monano</p>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th rowspan="2">Identitas Guru</th>
                    <th colspan="2">Data Pangkat</th>
                    <th colspan="2">Data Berkala</th>
                    <th colspan="2">Verifikasi Riil</th>
                    <th colspan="2">Verifikasi MyASN</th>
                </tr>
                <tr>
                    <th>Gol</th>
                    <th>TMT</th>
                    <th>Gaji</th>
                    <th>TMT</th>
                    <th>Status</th>
                    <th>Koreksi</th>
                    <th>Status</th>
                    <th>Koreksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9" style="text-align:center; padding: 40px;">Memuat data cloud...</td></tr>
            </tbody>
        </table>
    </div>

    <button class="btn-save" onclick="saveAll()">Simpan Seluruh Perubahan</button>
    
    <div class="footer-credit">
        DESIGNED & DEVELOPED BY <span>FADLIMEN</span>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwZb5rAUXHoOoW1uDncvTdCxeyN3nCYToR5UQZFehKF16OQwYwu6Wm9_k0MvgcJK0j2JA/exec'; 

    const dataGuru = [
        { id: 1, nama: "Rano Tahuhe, S.Pd.", mk: "8 Thn, 9 Bln", gol: "III/D", tmtPkt: "1 Okt 2018", gaji: "3.628.900", tmtBer: "1 Jan 2024" },
        { id: 2, nama: "Ridwan Hasan Pantu, Ss", mk: "9 Tahun, 3 Bln", gol: "III/D", tmtPkt: "1 Apr 2019", gaji: "4.042.500", tmtBer: "1 Jan 2026" },
        { id: 3, nama: "Hadija K. Atima, S.Pd.I", mk: "9 Tahun, 3 Bln", gol: "III/D", tmtPkt: "1 Apr 2018", gaji: "3.628.900", tmtBer: "1 Jan 2023" },
        { id: 4, nama: "Sulastri Harun, S.Kom.", mk: "9 Tahun, 3 Bln", gol: "III/D", tmtPkt: "1 Apr 2019", gaji: "3.628.900", tmtBer: "1 Jan 2024" },
        { id: 5, nama: "Zainab K. Hamimu, S.Pd.", mk: "8 Thn, 1 Bln", gol: "III/C", tmtPkt: "1 Apr 2023", gaji: "3.533.900", tmtBer: "1 Mar 2025" },
        { id: 6, nama: "Basmawati, S.Pd.", mk: "4 Thn, 2 Bln", gol: "III/B", tmtPkt: "1 Okt 2021", gaji: "3.287.000", tmtBer: "1 Ags 2025" },
        { id: 7, nama: "Muhlis Dudokia, S.Pd.", mk: "4 Thn, 1 Bln", gol: "III/B", tmtPkt: "1 Apr 2023", gaji: "3.186.600", tmtBer: "1 Mar 2025" },
        { id: 8, nama: "Sandrawati Anwar, S.Pd.", mk: "4 Thn, 1 Bln", gol: "III/B", tmtPkt: "1 Apr 2023", gaji: "3.186.600", tmtBer: "1 Mar 2025" },
        { id: 9, nama: "Mohamad Fadlianto S. Mento, S.Kom.", mk: "0 Thn", gol: "IX", tmtPkt: "1 Mar 2022", gaji: "2.966.500", tmtBer: "1 Mar 2022" },
        { id: 10, nama: "Rita Uno, S.Pd.", mk: "0 Thn", gol: "IX", tmtPkt: "1 Jul 2023", gaji: "2.966.500", tmtBer: "1 Jul 2023" }
    ];

    async function loadData() {
        try {
            const response = await fetch(scriptURL);
            const savedData = await response.json();
            renderTable(savedData);
        } catch (e) { renderTable({}); }
    }

    function renderTable(savedData) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = dataGuru.map(g => {
            const s = savedData[g.id] || { stLagi: '', stMyAsn: '', valLagi: '', valMyAsn: '' };
            return `
                <tr id="row-${g.id}">
                    <td><span class="name-cell">${g.nama}</span><span class="mk-label">MK ${g.mk}</span></td>
                    <td>${g.gol}</td>
                    <td>${g.tmtPkt}</td>
                    <td>Rp ${g.gaji}</td>
                    <td>${g.tmtBer}</td>
                    <td>
                        <select onchange="checkStatus(${g.id})" id="stLagi-${g.id}">
                            <option value="">-</option>
                            <option value="Sesuai" ${s.stLagi === 'Sesuai' ? 'selected' : ''}>Sesuai</option>
                            <option value="Tidak Sesuai" ${s.stLagi === 'Tidak Sesuai' ? 'selected' : ''}>Tidak Sesuai</option>
                        </select>
                    </td>
                    <td><input type="text" id="valLagi-${g.id}" class="input-koreksi" value="${s.valLagi || ''}" placeholder="Koreksi..." style="display:${s.stLagi==='Tidak Sesuai'?'block':'none'}"></td>
                    <td>
                        <select onchange="checkStatus(${g.id})" id="stMyAsn-${g.id}">
                            <option value="">-</option>
                            <option value="Sesuai" ${s.stMyAsn === 'Sesuai' ? 'selected' : ''}>Sesuai</option>
                            <option value="Tidak Sesuai" ${s.stMyAsn === 'Tidak Sesuai' ? 'selected' : ''}>Tidak Sesuai</option>
                        </select>
                    </td>
                    <td><input type="text" id="valMyAsn-${g.id}" class="input-koreksi" value="${s.valMyAsn || ''}" placeholder="Koreksi MyASN..." style="display:${s.stMyAsn==='Tidak Sesuai'?'block':'none'}"></td>
                </tr>`;
        }).join('');
        dataGuru.forEach(g => checkStatus(g.id));
    }

    function checkStatus(id) {
        const row = document.getElementById(`row-${id}`);
        const stLagi = document.getElementById(`stLagi-${id}`).value;
        const stMyAsn = document.getElementById(`stMyAsn-${id}`).value;
        document.getElementById(`valLagi-${id}`).style.display = (stLagi === 'Tidak Sesuai') ? 'block' : 'none';
        document.getElementById(`valMyAsn-${id}`).style.display = (stMyAsn === 'Tidak Sesuai') ? 'block' : 'none';
        row.classList.remove('row-green', 'row-red');
        if (stLagi === 'Sesuai' && stMyAsn === 'Sesuai') row.classList.add('row-green');
        else if (stLagi === 'Tidak Sesuai' || stMyAsn === 'Tidak Sesuai') row.classList.add('row-red');
    }

    async function saveAll() {
        const btn = document.querySelector('.btn-save');
        btn.innerText = "⏳ Sedang Sinkronisasi...";
        btn.disabled = true;
        const payload = {};
        dataGuru.forEach(g => {
            payload[g.id] = {
                stLagi: document.getElementById(`stLagi-${g.id}`).value,
                stMyAsn: document.getElementById(`stMyAsn-${g.id}`).value,
                valLagi: document.getElementById(`valLagi-${g.id}`).value,
                valMyAsn: document.getElementById(`valMyAsn-${g.id}`).value
            };
        });
        try {
            await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert('✅ Berhasil Terkirim ke Server Sekolah!');
        } catch (e) { alert('❌ Gagal sinkronisasi data.'); }
        finally { btn.innerText = "Simpan Seluruh Perubahan"; btn.disabled = false; loadData(); }
    }

    loadData();
</script>

</body>
</html>
